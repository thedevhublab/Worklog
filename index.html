<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <meta name="description" content="하루의 업무를 기록하고 분류해 월별로 돌아보는 Worklog">
    <title>Worklog — 업무일지</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Worklog 홈" data-i18n-aria="home">
          <span class="logo" aria-hidden="true">✳</span>
          <span class="brand-copy">
            <span class="brandname">Work<span>log</span></span>
            <span class="brand-sub" data-i18n="brandSubtitle">업무 기록</span>
          </span>
        </a>
        <div class="top-actions" aria-label="데이터 및 언어" data-i18n-aria="languageControls">
          <button class="btn" id="languageBtn" type="button" aria-label="Change language">EN</button>
          <button class="btn" id="exportBtn" type="button" data-i18n="export">↓ 백업</button>
          <button class="btn" id="importBtn" type="button" data-i18n="import">↑ 복원</button>
          <input id="fileInput" class="visually-hidden" type="file" accept="application/json,.json" tabindex="-1" aria-label="JSON 백업 파일 선택" data-i18n-aria="filePicker">
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="heroTitle">
          <div>
            <div class="eyebrow">MY WORK JOURNAL</div>
            <h1 id="heroTitle" data-i18n="heroTitle">오늘의 기록, 차곡차곡</h1>
            <p data-i18n="heroDescription">하루의 업무를 기록하고, 한 달의 성장을 돌아보세요.</p>
          </div>
          <time class="today" id="todayText"></time>
        </section>

        <section class="stats" aria-label="업무 통계" data-i18n-aria="statistics">
          <article class="stat">
            <div class="stat-label" data-i18n="currentMonthEntries">이번 달 기록</div>
            <div class="stat-value" id="monthCount" aria-live="polite">0<small>건</small></div>
          </article>
          <article class="stat">
            <div class="stat-label" data-i18n="allEntries">전체 업무일지</div>
            <div class="stat-value" id="allCount">0<small>건</small></div>
          </article>
          <article class="stat">
            <div class="stat-label" data-i18n="loggedDays">기록한 날짜</div>
            <div class="stat-value" id="dayCount">0<small>일</small></div>
          </article>
        </section>

        <div class="main-layout">
          <section class="panel list-panel" aria-labelledby="entriesHeading">
            <div class="panel-head">
              <h2 class="panel-title" id="entriesHeading"><span data-i18n="workEntries">업무 기록</span> <span class="count" id="resultCount">0건</span></h2>
              <button class="btn primary" id="newBtn" type="button">＋ <span data-i18n="newEntry">새 기록</span></button>
            </div>

            <div class="filters" aria-label="기록 검색과 필터" data-i18n-aria="searchFilters">
              <div class="month-picker">
                <button class="field month-display" id="monthTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="monthPopup"></button>
                <input id="monthFilter" type="hidden">
                <div class="month-popup" id="monthPopup" role="dialog" aria-label="월 선택" aria-modal="false" hidden>
                  <div class="month-year-nav">
                    <button class="month-year-button" id="previousYear" type="button" aria-label="이전 연도">‹</button>
                    <strong id="monthYearLabel"></strong>
                    <button class="month-year-button" id="nextYear" type="button" aria-label="다음 연도">›</button>
                  </div>
                  <div class="month-grid" id="monthGrid"></div>
                </div>
              </div>
              <label class="visually-hidden" for="sortFilter" data-i18n="sortBy">정렬 기준</label>
              <select class="field" id="sortFilter">
                <option value="new">최신순</option>
                <option value="old">오래된순</option>
                <option value="title">제목순</option>
              </select>
              <label class="visually-hidden" for="categoryFilter" data-i18n="filterByCategory">분류 필터</label>
              <select class="field" id="categoryFilter"><option value="">전체 분류</option></select>
              <button class="btn manage-categories" id="manageCategoriesBtn" type="button" data-i18n="manageCategories">분류 관리</button>
              <label class="visually-hidden" for="search" data-i18n="searchEntries">기록 검색</label>
              <input class="field search" id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="기록 검색..." autocomplete="off">
            </div>

            <div class="filter-summary" id="filterSummary" aria-live="polite"></div>
            <div class="entries" id="entries" aria-live="polite" aria-busy="false"></div>
          </section>

          <aside class="panel form-panel" id="formPanel" aria-labelledby="formHeading">
            <div class="form-title">
              <h2 id="formHeading" data-i18n="newWorkEntry">새 업무 기록</h2>
              <button class="close" id="closeForm" type="button" data-i18n="close">닫기</button>
            </div>
            <form id="journalForm" novalidate>
              <input type="hidden" id="editId">
              <div class="form-group">
                <label for="entryDate" data-i18n="date">날짜</label>
                <div class="date-picker">
                  <input id="entryDate" type="text" inputmode="numeric" autocomplete="off" placeholder="YYYY-MM-DD" required aria-describedby="dateHint dateError">
                  <button class="calendar-trigger" id="dateTrigger" type="button" aria-label="날짜 선택" aria-haspopup="dialog" aria-expanded="false" aria-controls="datePopup">▦</button>
                  <div class="date-popup" id="datePopup" role="dialog" aria-label="날짜 선택" aria-modal="false" hidden>
                    <div class="calendar-header">
                      <button class="month-year-button" id="previousCalendarMonth" type="button" aria-label="이전 달">‹</button>
                      <strong id="calendarMonthLabel"></strong>
                      <button class="month-year-button" id="nextCalendarMonth" type="button" aria-label="다음 달">›</button>
                    </div>
                    <div class="calendar-weekdays" id="calendarWeekdays"></div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                  </div>
                </div>
                <small class="field-hint" id="dateHint" data-i18n="dateHint">YYYY-MM-DD</small>
                <small class="field-error" id="dateError" aria-live="polite"></small>
              </div>
              <div class="form-group">
                <label for="entryTitle"><span data-i18n="title">업무 제목</span> <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="entryTitle" type="text" maxlength="80" required data-i18n-placeholder="titlePlaceholder" placeholder="예: 신규 서비스 기획안 작성" aria-describedby="titleHint titleError">
                <small class="field-hint" id="titleHint" data-i18n="titleLimit">최대 80자</small>
                <small class="field-error" id="titleError" aria-live="polite"></small>
              </div>
              <div class="form-group">
                <label for="entryContent" data-i18n="details">업무 내용</label>
                <textarea id="entryContent" maxlength="3000" data-i18n-placeholder="detailsPlaceholder" placeholder="오늘 진행한 업무와 결과를 기록해보세요." aria-describedby="contentHint"></textarea>
                <small class="field-hint" id="contentHint" data-i18n="detailsLimit">최대 3,000자</small>
              </div>
              <div class="row">
                <div class="form-group">
                  <label for="entryCategory" data-i18n="category">분류</label>
                  <select id="entryCategory"></select>
                </div>
                <div class="form-group">
                  <label for="entryHours" data-i18n="timeSpent">소요 시간 (시간)</label>
                  <input id="entryHours" type="number" min="0" max="24" step="0.5" inputmode="decimal" placeholder="예: 2" aria-describedby="hoursHint hoursError">
                  <small class="field-hint" id="hoursHint" data-i18n="hoursHint">0~24시간 · 30분 단위</small>
                  <small class="field-error" id="hoursError" aria-live="polite"></small>
                </div>
              </div>
              <div class="form-actions">
                <button class="btn" type="button" id="cancelBtn" data-i18n="cancel">취소</button>
                <button class="btn primary" type="submit" id="saveBtn" data-i18n="saveEntry">기록 저장</button>
              </div>
              <p class="save-note" data-i18n="localSaveNote">기록은 이 브라우저에 자동 저장됩니다.</p>
            </form>
          </aside>
        </div>
      </main>
    </div>

    <div class="overlay" id="overlay" hidden></div>
    <section class="category-modal" id="categoryModal" aria-hidden="true" hidden>
      <div class="category-dialog" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle" tabindex="-1">
        <div class="form-title">
          <h2 id="categoryModalTitle" data-i18n="manageCategories">분류 관리</h2>
          <button class="close" id="closeCategoryModal" type="button" data-i18n="close">닫기</button>
        </div>
        <p class="category-help" data-i18n="categoryHelp">한국어와 영어 분류명을 직접 입력하고 관리하세요.</p>
        <form class="category-add" id="categoryForm" novalidate>
          <div class="category-add-fields">
            <div>
              <label class="visually-hidden" for="newCategoryName" data-i18n="koreanCategoryName">한국어 분류명</label>
              <input class="field" id="newCategoryName" type="text" maxlength="24" data-i18n-placeholder="koreanCategoryName" placeholder="한국어 분류명" required>
            </div>
            <div>
              <label class="visually-hidden" for="newCategoryEnglish" data-i18n="englishCategoryName">영어 분류명</label>
              <input class="field" id="newCategoryEnglish" type="text" maxlength="24" data-i18n-placeholder="englishCategoryName" placeholder="영어 분류명" required>
            </div>
          </div>
          <button class="btn primary" id="addCategoryBtn" type="submit" data-i18n="add">추가</button>
          <small class="field-error" id="categoryError" aria-live="polite"></small>
        </form>
        <div class="category-list" id="categoryList"></div>
        <p class="category-delete-note" data-i18n="categoryDeleteNote">분류를 삭제해도 업무 기록은 보존되며 다른 분류로 이동합니다.</p>
      </div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="script.js" defer></script>
  </body>
</html>
