<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f5">
<title>일로그 — 업무일지</title>
<link rel="stylesheet" href="style.css">
</head>
<body><div class="shell">
<header class="topbar"><div class="brand"><div class="logo">✳</div><div><div class="brandname">Work<span>log</span></div><div class="brand-sub">나의 업무를 차곡차곡 기록하다</div></div></div><div class="top-actions"><button class="btn" id="languageBtn" aria-label="Change language">EN</button><button class="btn" id="exportBtn">↓ 백업</button><button class="btn" id="importBtn">↑ 복원</button><input id="fileInput" type="file" accept="application/json,.json" class="hidden"></div></header>
<section class="hero"><div><div class="eyebrow">MY WORK JOURNAL</div><h1>오늘의 기록, <span id="heroName">차곡차곡</span></h1><p>하루의 업무를 기록하고, 한 달의 성장을 돌아보세요.</p></div><div class="today" id="todayText"></div></section>
<section class="stats"><div class="stat"><div class="stat-label">이번 달 기록</div><div class="stat-value" id="monthCount">0<small>건</small></div></div><div class="stat"><div class="stat-label">전체 업무일지</div><div class="stat-value" id="allCount">0<small>건</small></div></div><div class="stat"><div class="stat-label">기록한 날짜</div><div class="stat-value" id="dayCount">0<small>일</small></div></div></section>
<div class="main"><section class="panel list-panel"><div class="panel-head"><div class="panel-title">업무 기록 <span class="count" id="resultCount">0건</span></div><button class="btn primary" id="newBtn">＋ 새 기록</button></div><div class="filters"><div class="month-picker"><button class="field month-display" id="monthTrigger" type="button" aria-haspopup="dialog" aria-expanded="false"></button><input id="monthFilter" type="hidden"><div class="month-popup" id="monthPopup" role="dialog" aria-label="월 선택"><div class="month-year-nav"><button class="month-year-button" id="previousYear" type="button" aria-label="이전 연도">‹</button><strong id="monthYearLabel"></strong><button class="month-year-button" id="nextYear" type="button" aria-label="다음 연도">›</button></div><div class="month-grid" id="monthGrid"></div></div></div><select class="field" id="sortFilter"><option value="new">최신순</option><option value="old">오래된순</option><option value="title">제목순</option></select><select class="field" id="categoryFilter"><option value="">전체 분류</option></select><button class="btn manage-categories" id="manageCategoriesBtn">분류 관리</button><input class="field search" id="search" placeholder="기록 검색..." aria-label="기록 검색"></div><div class="entries" id="entries"></div></section>
<aside class="panel form-panel" id="formPanel"><div class="form-title"><h2 id="formHeading">새 업무 기록</h2><button class="close" id="closeForm">닫기</button></div><form id="journalForm"><input type="hidden" id="editId"><div class="form-group"><label for="entryDate">날짜</label><input id="entryDate" type="date" required></div><div class="form-group"><label for="entryTitle">업무 제목</label><input id="entryTitle" maxlength="80" placeholder="예: 신규 서비스 기획안 작성" required></div><div class="form-group"><label for="entryContent">업무 내용</label><textarea id="entryContent" maxlength="3000" placeholder="오늘 진행한 업무와 결과를 기록해보세요."></textarea></div><div class="row"><div class="form-group"><label for="entryCategory">분류</label><select id="entryCategory"></select></div><div class="form-group"><label for="entryHours">소요 시간 (시간)</label><input id="entryHours" type="number" min="0" max="24" step="0.5" placeholder="예: 2"></div></div><div class="form-actions"><button class="btn" type="button" id="cancelBtn">취소</button><button class="btn primary" type="submit" id="saveBtn">기록 저장</button></div><div class="save-note">기록은 이 브라우저에 자동 저장됩니다.</div></form></aside></div></div><div class="overlay" id="overlay"></div><div class="category-modal" id="categoryModal" aria-hidden="true"><div class="category-dialog"><div class="form-title"><h2>분류 관리</h2><button class="close" id="closeCategoryModal">닫기</button></div><p class="category-help">한국어와 영어 분류명을 직접 입력하고 관리하세요.</p><div class="category-add"><div class="category-add-fields"><input class="field" id="newCategoryName" maxlength="24" placeholder="한국어 분류명"><input class="field" id="newCategoryEnglish" maxlength="24" placeholder="영어 분류명"></div><button class="btn primary" id="addCategoryBtn">추가</button></div><div class="category-list" id="categoryList"></div></div></div><div class="toast" id="toast"></div>
<script src="script.js"></script></body></html>
